[project]
name = "fastapi-langchain-rag"
version = "1.1.0"
description = "FastAPI + LangChain RAG pipeline with Chainlit chat UI — document Q&A over ChromaDB and OpenAI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "mortogo321" }]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "langchain==1.4.3",
  "langchain-openai==1.6.7",
  "langchain-community==0.4.2",
  "langchain-chroma==1.1.0",
  "langchain-core==1.6.5",
  "langchain-text-splitters==1.1.2",
  "chromadb==1.5.9",
  "chainlit==2.12.0",
  "python-multipart==0.0.32",
  "pypdf==6.19.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "anyio==4.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.16.9",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC", "S", "A"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = false
show_error_codes = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["chainlit.*", "chainlit_app"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
